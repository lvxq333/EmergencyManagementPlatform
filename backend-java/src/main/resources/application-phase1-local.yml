# Explicit opt-in local development profile. Do not use on a public server.
server:
  address: 127.0.0.1
  port: 18081
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13316/risk_platform_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: riskdev
    password: risk-local-development-only
  sql:
    init:
      mode: never
risk-platform:
  redis-enabled: false
  persist-risk-events: false
  expose-internal-errors: false
  simulator-enabled: true
  simulator-scan-millis: 1000
